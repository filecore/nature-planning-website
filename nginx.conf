server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aggressive gzip: the national-parks.geojson alone is ~1.7 MB raw and
    # ~350 kB gzipped. Worth turning on for both data and static assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json image/svg+xml;

    # Cheap healthcheck for AutoKuma / uptime monitoring.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Static assets: aggressive caching.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Data layers and sources.json: short cache, content changes per refresh.
    # Force application/geo+json on .geojson so gzip_types and the browser
    # recognise it as JSON instead of an opaque download.
    location /data/ {
        add_header Cache-Control "public, max-age=300";
        types {
            application/geo+json  geojson;
            application/json      json;
        }
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
